[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "localgate-research"
version = "0.1.0"
description = "Data preparation, grading, modelling and analysis for the LocalGate study."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.3",
    "scipy==1.17.1",
    "pandas==3.0.6",
    "statsmodels==0.15.0",
    "ecologits==0.11.1",
    "matplotlib==3.11.2",
    "fonttools==4.65.0",
    "pydantic-ai-slim[anthropic,bedrock,openai,retries]==2.51.0",
    "httpx2==2.13.1",
    "boto3==1.43.105",
    "tenacity==9.1.4",
]

[project.optional-dependencies]
corpus = ["datasets==5.0.1"]
model = [
    "torch==2.13.0",
    "transformers==5.14.1",
    "peft==0.20.0",
    "safetensors==0.8.0",
]
measurement = [
    "torch==2.13.0",
    "transformers==5.14.1",
    "peft==0.20.0",
    "safetensors==0.8.0",
    "codecarbon==3.2.7",
]
tdm = [
    "pyarrow==25.0.1",
]

[project.scripts]
localgate-data = "research.data.__main__:main"
localgate-analysis = "research.analysis.__main__:main"
localgate-grade = "research.grading.judge:main"
localgate-figures = "research.figures.reproduce:main"
localgate-model = "research.model_source.__main__:main"
localgate-tdm = "research.tdm.__main__:main"

[tool.setuptools]
packages = [
    "research",
    "research.analysis",
    "research.data",
    "research.grading",
    "research.figures",
    "research.figures.concepts",
    "research.model_source",
    "research.model_source.localgate_research",
    "research.tdm",
]

[tool.setuptools.package-data]
"research.data" = ["environments/*.txt"]
"research.figures.concepts" = ["*.tex", "*.json", "*.txt"]
"research.model_source" = ["classifier_energy.csv"]
